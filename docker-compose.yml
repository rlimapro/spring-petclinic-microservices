services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 8888:8888
    networks:
      - petclinic-net

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - 8761:8761
    networks:
      - petclinic-net

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      otel-agent:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/otel-javaagent.jar"
      OTEL_SERVICE_NAME: "customers-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES-HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports:
      - 8081:8081
    networks:
      - petclinic-net

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      otel-agent:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/otel-javaagent.jar"
      OTEL_SERVICE_NAME: "visits-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES-HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports:
      - 8082:8082
    networks:
      - petclinic-net

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      otel-agent:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/otel-javaagent.jar"
      OTEL_SERVICE_NAME: "vets-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES-HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports:
      - 8083:8083
    networks:
      - petclinic-net

  genai-service:
    image: springcommunity/spring-petclinic-genai-service
    container_name: genai-service
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      otel-agent:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/otel-javaagent.jar"
      OTEL_SERVICE_NAME: "genai-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES-HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports:
      - 8084:8084
    networks:
      - petclinic-net

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - otel-agent:/otel:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      otel-agent:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/otel-javaagent.jar"
      OTEL_SERVICE_NAME: "api-gateway"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES-HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    ports:
      - 8080:8080
    networks:
      - petclinic-net

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 9090:9090
    networks:
      - petclinic-net

  ## OPEN TELEMETRY

  otel-agent:
    build:
      context: ./otel
    image: otel-javaagent:2.28.1
    volumes:
      - otel-agent:/otel

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - petclinic-net

  grafana-tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
      - "4319:4318"
    networks:
      - petclinic-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - petclinic-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - grafana-tempo
    networks:
      - petclinic-net

volumes:
  otel-agent:

networks:
  petclinic-net: